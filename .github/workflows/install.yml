name: Verificar instalación Android 15
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  instalar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Descargar la APK pública
        run: |
          mkdir -p evidencia
          curl -L --fail 'https://github.com/JoseBenitezAlba/pulso/releases/download/pruebas/pulso.apk' -o evidencia/pulso.apk
          sha256sum evidencia/pulso.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install evidencia/pulso.apk | tee evidencia/install.txt
            adb shell am start -n es.pulso.music/.MainActivity
            sleep 4
            adb shell screencap -p /sdcard/instalada.png
            adb pull /sdcard/instalada.png evidencia/instalada.png
            adb shell pm grant es.pulso.music android.permission.READ_MEDIA_AUDIO
            adb shell am force-stop es.pulso.music
            adb shell am start -n es.pulso.music/.MainActivity
            sleep 3
            adb logcat -d -s AndroidRuntime > evidencia/errors.txt
            ! grep -q 'FATAL EXCEPTION' evidencia/errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instalacion-android15
          path: evidencia/
