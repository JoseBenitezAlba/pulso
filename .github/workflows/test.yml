name: Pruebas
# Pruebas en emulador. Son lentas, así que solo se lanzan a mano o en pull requests.
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar
        env:
          KEYSTORE: ${{ secrets.PULSO_KEYSTORE }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p build
          printf '%s' "$KEYSTORE" | base64 -d > build/pulso.jks
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pulso-apk
          path: build/pulso.apk

  basico:
    # Permiso, biblioteca, gestos, listas, reproducción con pantalla apagada y persistencia.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pulso-apk
          path: build
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          script: python3 tests/test_basico.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-basico
          path: |
            build/*.png
            build/errors.txt

  actualizacion:
    # Instala la versión publicada (release "pruebas") y actualiza encima con la nueva.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pulso-apk
          path: build
      - name: Descargar APK anterior
        run: curl -L --fail https://github.com/JoseBenitezAlba/pulso/releases/download/pruebas/pulso.apk -o build/old.apk
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          script: python3 tests/test_actualizacion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-actualizacion
          path: |
            build/*.png
            build/errors.txt

  android15:
    # Instalar y abrir en Android 15 (API 35) sin cierres.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pulso-apk
          path: build
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install build/pulso.apk
            adb shell am start -n es.pulso.music/.MainActivity
            sleep 4
            adb shell pm grant es.pulso.music android.permission.READ_MEDIA_AUDIO
            adb shell am force-stop es.pulso.music
            adb shell am start -n es.pulso.music/.MainActivity
            sleep 3
            adb logcat -d -s AndroidRuntime > build/errors.txt
            ! grep -q 'FATAL EXCEPTION' build/errors.txt
