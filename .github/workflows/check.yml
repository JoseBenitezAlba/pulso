name: Pruebas Android
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compilar
        env:
          KEYSTORE: ${{ secrets.PULSO_KEYSTORE }}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p src/es/pulso/music res/drawable build
          cp MainActivity.java PlayerService.java Song.java src/es/pulso/music/
          cp icon.xml res/drawable/
          printf '%s' "$KEYSTORE" | base64 -d > build/pulso.jks
          bash build-release.sh
      - name: Activar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          script: |
            adb install build/pulso.apk
            adb shell am start -n es.pulso.music/.MainActivity
            sleep 5
            adb shell screencap -p /sdcard/permiso.png
            adb pull /sdcard/permiso.png build/permiso.png
            adb shell pm grant es.pulso.music android.permission.READ_EXTERNAL_STORAGE
            adb shell am force-stop es.pulso.music
            adb shell am start -n es.pulso.music/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/biblioteca.png
            adb pull /sdcard/biblioteca.png build/biblioteca.png
            adb logcat -d -s AndroidRuntime > build/errors.txt
            test ! -s build/errors.txt || ! grep -q 'FATAL EXCEPTION' build/errors.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-android
          path: build/
